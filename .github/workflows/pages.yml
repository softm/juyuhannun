name: Collect, verify and deploy Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # KST 01:17, 02:17, 09:17, 12:17, 16:17, 19:17.
    # Actions schedules can be delayed; source timestamps remain authoritative.
    - cron: '17 0,3,7,10,16,17 * * *'
    # KST 20:37 — after the daytime Opinet updates, collect the daily nationwide snapshot.
    - cron: '37 11 * * *'

permissions:
  contents: read

concurrency:
  group: juyuhannun-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  build:
    outputs:
      pages_artifact: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install runtime dependencies
        run: npm install --no-audit --no-fund
      - name: Verify core, data and route behaviour
        run: npm test
      - name: Restore last collected data
        if: github.event_name != 'pull_request'
        uses: actions/cache/restore@v6
        with:
          path: |
            public/data/stations.json
            public/data/averages.json
            public/data/highway.json
            public/data/nationwide
          key: fuel-data-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            fuel-data-v2-
            opinet-data-v1-
      - name: Restore shared daily call ledger
        if: github.event_name != 'pull_request'
        uses: actions/cache/restore@v6
        with:
          path: |
            .cache/opinet-quota.json
            .cache/ex-quota.json
          key: fuel-quota-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            fuel-quota-v2-
            opinet-quota-v1-
      - name: Collect official prices or preserve explicit unavailable state
        if: github.event_name != 'pull_request'
        id: collect
        continue-on-error: true
        env:
          OPINET_API_KEY: ${{ secrets.OPINET_API_KEY }}
          OPINET_DIAGNOSTICS: '1'
        run: node scripts/collect.mjs --output public/data/stations.json --ledger .cache/opinet-quota.json
      - name: Collect regional averages and highway fuel data
        if: github.event_name != 'pull_request' && steps.collect.outcome == 'success'
        continue-on-error: true
        env:
          OPINET_API_KEY: ${{ secrets.OPINET_API_KEY }}
          OPINET_DIAGNOSTICS: '1'
          EX_API_KEY: ${{ secrets.EX_API_KEY }}
        run: npm run collect:energy
      - name: Collect nationwide daily public snapshot
        if: github.event_name != 'pull_request' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.schedule == '37 11 * * *')
        continue-on-error: true
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          NATIONWIDE_FORCE_REFRESH: ${{ (github.event_name == 'workflow_dispatch' || github.event.schedule == '37 11 * * *') && '1' || '0' }}
        run: npm run collect:nationwide
      - name: Save consumed quota even after collection failure
        if: always() && github.event_name != 'pull_request'
        uses: actions/cache/save@v6
        with:
          path: |
            .cache/opinet-quota.json
            .cache/ex-quota.json
          key: fuel-quota-v2-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Validate deployable assets and data
        run: npm run check
      - name: Preserve last collection result
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@v6
        with:
          path: |
            public/data/stations.json
            public/data/averages.json
            public/data/highway.json
            public/data/nationwide
          key: fuel-data-v2-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Build for project root
        env:
          PUBLIC_API_BASE: ${{ vars.PUBLIC_API_BASE }}
        run: npm run build
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload website
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      - name: Report data readiness
        if: github.event_name != 'pull_request'
        run: |
          node --input-type=module <<'JS'
          import {readFile,appendFile} from 'node:fs/promises';
          let report='## 주유한눈 데이터 상태\n\n[수집 현황 페이지](https://softm.github.io/juyuhannun/data-status.html)\n\n| 자료 | 상태 | 건수 | 마지막 성공 수집 | 이전 자료 보존 |\n|---|---|---:|---|---|\n';
          for(const [name,file,field] of [['주변 주유소','stations','stations'],['전국 일괄가격','nationwide/latest','stations'],['평균 유가','averages','benchmarks'],['고속도로 주유소','highway','stations']]){
            const d=JSON.parse(await readFile(`public/data/${file}.json`,'utf8'));
            report+=`| ${name} | ${d.status} | ${d[field].length} | ${d.fetchedAt??'없음'} | ${d.cache?.stale?'예':'아니요'} |\n`;
          }
          const manifest=JSON.parse(await readFile('public/data/nationwide/manifest.json','utf8'));
          report+=`\n전국 가격 ${manifest.priceStationCount??0}곳 · 지도 좌표 ${manifest.mappedPriceStationCount??0}곳 · 좌표 미확보 ${Math.max(0,(manifest.priceStationCount??0)-(manifest.mappedPriceStationCount??0))}곳 · 가격 기준일 ${manifest.priceDate??'미확인'}\n`;
          report+='\n가격 기준시각은 유종별 priceUpdatedAt, 평균 기준일은 asOfDate를 확인합니다. 수소 자료는 직전월 평균의 공식 안내입니다. API 미연결 상태의 배포 성공은 실가격 연동 성공을 뜻하지 않습니다.\n';
          await appendFile(process.env.GITHUB_STEP_SUMMARY,report);
          JS

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build.outputs.pages_artifact }}
