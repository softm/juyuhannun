name: Collect, verify and deploy Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # KST 08:17, 14:17, 20:17 — nationwide file + general API comparison/enrichment.
    # GitHub Actions schedules can be delayed; source timestamps remain authoritative.
    - cron: '17 23,5,11 * * *'

permissions:
  contents: read

concurrency:
  group: juyuhannun-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  build:
    outputs:
      pages_artifact: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install runtime dependencies
        run: npm install --no-audit --no-fund
      - name: Verify core, data and route behaviour
        run: npm test
      - name: Restore last collected data
        id: restore_data
        if: github.event_name != 'pull_request'
        uses: actions/cache/restore@v6
        with:
          path: |
            public/data/stations.json
            public/data/averages.json
            public/data/highway.json
            public/data/comparisons.json
            public/data/nationwide
          key: fuel-data-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            fuel-data-v2-
            opinet-data-v1-
      - name: Restore shared daily call ledger
        if: github.event_name != 'pull_request'
        uses: actions/cache/restore@v6
        with:
          path: |
            .cache/opinet-quota.json
            .cache/ex-quota.json
          key: fuel-quota-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            fuel-quota-v2-
            opinet-quota-v1-
      - name: Collect official prices or preserve explicit unavailable state
        if: github.event_name != 'pull_request'
        id: collect
        continue-on-error: true
        env:
          OPINET_API_KEY: ${{ secrets.OPINET_API_KEY }}
          OPINET_DIAGNOSTICS: '1'
        run: node scripts/collect.mjs --output public/data/stations.json --ledger .cache/opinet-quota.json
      - name: Collect regional averages and highway fuel data
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          OPINET_API_KEY: ${{ secrets.OPINET_API_KEY }}
          OPINET_DIAGNOSTICS: '1'
          EX_API_KEY: ${{ secrets.EX_API_KEY }}
        run: npm run collect:energy
      - name: Collect nationwide lowest-price comparison samples
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          OPINET_API_KEY: ${{ secrets.OPINET_API_KEY }}
        run: npm run collect:comparisons
      - name: Enrich missing station coordinates within the shared daily quota
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          OPINET_API_KEY: ${{ secrets.OPINET_API_KEY }}
        run: node scripts/enrich-coordinates.mjs --max-calls 20 --daily-budget 60 --reserve 60
      - name: Check nationwide source date and collect when due
        if: github.event_name != 'pull_request'
        id: nationwide
        continue-on-error: true
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          NATIONWIDE_FORCE_REFRESH: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: npm run collect:nationwide
      - name: Geocode business addresses missing coordinates
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          NAVER_MAPS_API_KEY_ID: ${{ secrets.NAVER_MAPS_API_KEY_ID }}
          NAVER_MAPS_API_KEY: ${{ secrets.NAVER_MAPS_API_KEY }}
          NAVER_GEOCODE_MAX_PER_RUN: '1000'
        run: node scripts/geocode-business-addresses.mjs
      - name: Republish nationwide map with address geocodes
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: npm run collect:nationwide
      - name: Save consumed quota even after collection failure
        if: always() && github.event_name != 'pull_request'
        uses: actions/cache/save@v6
        with:
          path: |
            .cache/opinet-quota.json
            .cache/ex-quota.json
          key: fuel-quota-v2-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Preserve last collection result
        if: always() && github.event_name != 'pull_request' && steps.restore_data.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: |
            public/data/stations.json
            public/data/averages.json
            public/data/highway.json
            public/data/comparisons.json
            public/data/nationwide
          key: fuel-data-v2-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Validate deployable assets and data
        run: npm run check
      - name: Verify actual map availability and price freshness
        if: github.event_name != 'pull_request'
        run: node scripts/verify-published-data.mjs
      - name: Build for project root
        env:
          PUBLIC_API_BASE: ${{ vars.PUBLIC_API_BASE }}
        run: npm run build
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload website
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      - name: Report data readiness
        if: github.event_name != 'pull_request'
        run: |
          node --input-type=module <<'JS'
          import {readFile,appendFile} from 'node:fs/promises';
          const d=JSON.parse(await readFile('dist/data/status.json','utf8'));
          const time=value=>value?new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',dateStyle:'short',timeStyle:'short',hour12:false}).format(new Date(value)):'미확인';
          let report='## 주유한눈 데이터 상태\n\n[수집 현황 페이지](https://softm.github.io/juyuhannun/data-status.html) · 모든 시각은 한국시간\n\n';
          report+=`**수집 예정 08:17 · 14:17 · 20:17 KST (하루 3회)**\n\n**마지막 성공 수집 ${time(d.nationwide.fetchedAt)} · 실제 가격 기준일 ${d.nationwide.priceDate??'미확인'}**\n\n`;
          report+='| 자료 | 상태 | 건수 | 마지막 성공 수집 | 이전 자료 보존 |\n|---|---|---:|---|---|\n';
          for(const row of d.collections)report+=`| ${row.name} | ${row.status} | ${row.count} | ${time(row.fetchedAt)} | ${row.retained?'예':'아니요'} |\n`;
          const c=d.nationwide;
          report+=`\n전국 가격 ${c.totalPriceStations}곳 · 전국 지도 좌표 ${c.mappedPriceStations}곳 · 좌표 미확보 ${c.unmappedPriceStations}곳 · 지역 자료 병합 후 지도 표시 ${d.availability.displayableStationCount}곳\n\n`;
          report+='| 유종 | 지도 표시 | 현재 비교 가능 | 참고 가격 |\n|---|---:|---:|---:|\n';
          const names={B027:'휘발유',D047:'경유',B034:'고급휘발유',K015:'LPG'};
          for(const row of d.fuels)report+=`| ${names[row.code]} | ${row.mappedStationCount} | ${row.comparableStationCount} | ${row.historicalStationCount} |\n`;
          if(c.collection)report+=`\n전국 파일 최근 다운로드 결과: ${c.collection.lastDownloadStatus??'미확인'} · 재시도 가능 ${time(c.collection.nextRetryAt)}\n`;
          const e=d.coordinates;
          report+=`\n좌표 보완 ${e.status} · 누적 ${e.queue?.enrichedCount??0}곳 · 이번 ${e.lastAttempt?.successCount??0}곳 / ${e.lastAttempt?.calls??0}회 · 오늘 ${e.dayBudget?.used??0} / ${e.dayBudget?.limit??80}회\n`;
          if(d.quota)report+=`\n공유 오피넷 예산 ${d.quota.day}: ${d.quota.used} / ${d.quota.limit}회 · 남은 ${d.quota.remaining}회\n`;
          report+='\n참고 가격은 기본 지도·목록에 남지만 최저가·절약액 계산에서는 제외합니다. 일일 파일은 개별 보고 시각을 제공하지 않으며 가격 기준일·원래 수집 시각을 유지합니다. 배포 성공은 최신 가격 수집 성공을 보장하지 않습니다.\n';
          await appendFile(process.env.GITHUB_STEP_SUMMARY,report);
          JS

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build.outputs.pages_artifact }}

