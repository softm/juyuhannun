name: Deploy Cloudflare directions
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify deployment credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NAVER_KEY: ${{ secrets.NAVER_MAPS_API_KEY }}
        run: |
          test -n "$CF_TOKEN" && test -n "$CF_ACCOUNT" && test -n "$NAVER_KEY" || { echo 'Required Cloudflare deployment credentials are missing'; exit 1; }
      - name: Test directions contract and Worker adapter
        run: node --test services/cloudflare-directions/test/*.mjs
      - name: Deploy Worker and encrypted Naver secret
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: services/cloudflare-directions
          secrets: |
            NAVER_MAPS_API_SECRET
        env:
          NAVER_MAPS_API_SECRET: ${{ secrets.NAVER_MAPS_API_KEY }}
